<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RI:R v0.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-layout">
      <!-- FIXED: Changed class to header-box to match grid template areas -->
      <header class="header-box">
        <h2>Research Incremental v0.0</h2>
        <p class="subtitle">
          An incremental game of amoeba production, cells, and upgrades.
        </p>
      </header>

      <nav id="tabList" class="nav-box" aria-label="Game Tabs">
        <h2 class="panel-heading">Tabs</h2>
        <button id="switchToSettings">
          <img
            src="images/automation-icon.PNG"
            alt="settings"
            width="42"
            height="42"
          />
          <span>Settings</span>
        </button>
        <button id="switchToHelp">
          <img src="images/help-icon.PNG" alt="help" width="42" height="42" />
          <span>Help</span>
        </button>
        <button id="switchToAmoeba">
          <img
            src="images/amoeba-icon.PNG"
            alt="amoeba"
            width="42"
            height="42"
          />
          <span>Amoeba</span>
        </button>
        <button id="switchToCells" class="hide">Cells</button>
        <button id="switchToResearch" class="hide">Research</button>
        <button id="switchToBreakthroughs" class="hide">Breakthroughs</button>
        <!-- FIXED: Added explicit dimensions to prevent layout layout shifts -->

        <button id="switchToAutomation" class="hide">Automation</button>
      </nav>

      <aside id="statsList" class="stats-box">
        <h2 class="panel-heading">Stats</h2>
        <img src="images/amoeba-icon.PNG" alt="amoeba" width="42" height="42" />
        <p id="amoebaText"></p>

        <p id="clickPowerText"></p>
        <p id="critText"></p>
        <p id="clickCooldownText"></p>
        <img src="images/slamo.png" alt="slamo" width="42" height="42" />
        <p id="slamoText"></p>

        <h3 class="panel-subheading">Cells stats</h3>
        <p id="RNAText"></p>

        <p id="entropyText"></p>
        <p id="entropyBoostText"></p>
      </aside>

      <section id="resetContainer" class="reset-box">
        <h2 class="panel-heading">Reset</h2>
        <p id="resetText"></p>
        <p id="resetUnlockText"></p>
      </section>

      <!-- FIXED: Converted inner duplicate main tag to a semantic section element -->
      <section class="main-box">
        <div id="settingsTab" class="hide">
          <!--TODO:  Work on it -->
        </div>

        <div id="helpTab" class="hide">
          <!--TODO:  Work on it -->
        </div>

        <div id="mainTab">
          <h2 id="upgradeList" class="upgrade-list panel-heading">Upgrades</h2>

          <button id="amoebaButton">
            <img
              src="images/amoeba-icon.PNG"
              alt="slamo"
              width="42"
              height="42"
            />
            <span>Gain amoeba</span>
          </button>

          <div class="slamo-row">
            <h2 class="panel-heading">Slamo</h2>
            <div id="slamoContainer" class="gameplay-split">
              <button id="slamo">
                <img
                  src="images/slamo.png"
                  alt="slamo"
                  width="42"
                  height="42"
                />
                <span>Slamo</span>
              </button>

              <div id="dnaMachine" class="hide">
                <h3>THE MACHINE</h3>
                <div id="dnaContent">
                  <div id="dnaUpgrades">
                    <h4 class="normal-weight">UPGRADES</h4>
                    <div class="aggressivenessUpgrade">
                      <h5 class="medium-heading">Aggressiveness</h5>
                      <div id="aggressiveness"></div>
                      <div id="aggressivenessUpgradeButton"></div>
                    </div>
                    <div class="activeUpgrade">
                      <h5 class="medium-heading">Active</h5>
                      <div id="active"></div>
                      <div id="activeUpgradeButton"></div>
                    </div>
                    <div class="idleUpgrade">
                      <h5 class="medium-heading">Idle</h5>
                      <div id="idle"></div>
                      <div id="idleUpgradeButton"></div>
                    </div>
                  </div>

                  <div id="aggressivenessStat">
                    <h4 id="aggressivenessUpgrades" class="normal-weight">
                      Aggressiveness
                    </h4>
                    <span id="aggressivenessUpgradesCounter"></span>
                  </div>

                  <div id="activeStat">
                    <h4 id="activeUpgrades" class="normal-weight">Active</h4>
                    <span id="activeUpgradesCounter"></span>
                  </div>

                  <div id="idleStat">
                    <h4 id="idleUpgrades" class="normal-weight">Idle</h4>
                    <span id="idleUpgradesCounter"></span>
                  </div>
                </div>
              </div>
            </div>

            <ul id="milestones" class="hide"></ul>
            <button id="cellResetBtn" class="hide"></button>
          </div>

          <footer class="footer-box">
            <p id="info"></p>
            <div class="progress-container">
              <p id="progressText"></p>
              <span id="progressDescription"></span>
              <div
                class="progress-bar"
                id="amoebaProgress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
          </footer>
        </div>

        <div id="cellsTab" class="hide">
          <p id="cellInfoText">Cell</p>
          <div id="cell" class="cell hide">Click me!</div>
        </div>
      </section>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
